version: '3.8'

services:
  # 1. Web Service: URL Shortener & Live Analytics
  urlshortener:
    build:
      context: ./app_url_shortener
      dockerfile: Dockerfile
    container_name: urlshortener-web
    ports:
      - "8000:80"
    environment:
      - DB_FILE=/app/data/urls.db
    volumes:
      - urlshortener_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:80/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # 2. AI DevOps SRE Assistant & Telegram Bot
  ai-agent:
    build:
      context: ./app_ai_telegram
      dockerfile: Dockerfile
    container_name: ai-telegram-agent
    ports:
      - "8080:80"
    environment:
      - PORT=80
      - HOST=0.0.0.0
      - TARGET_APP_URL=http://urlshortener:80
      - ENABLE_PROACTIVE_MONITORING=true
      - MONITOR_INTERVAL_SECONDS=30
    env_file:
      - .env
    depends_on:
      urlshortener:
        condition: service_started
    volumes:
      - ai_agent_data:/app/data
      - ai_agent_workspace:/app/workspace
    restart: unless-stopped

  # 3. Prometheus Observability Scraper
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: devops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      urlshortener:
        condition: service_started
    restart: unless-stopped

  # 4. Grafana Visual SRE Dashboards
  grafana:
    image: grafana/grafana:10.0.3
    container_name: devops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  urlshortener_data:
  ai_agent_data:
  ai_agent_workspace:
  prometheus_data:
  grafana_data:
